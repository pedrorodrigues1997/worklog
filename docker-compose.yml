services:
  postgres:
    image: postgres:17-alpine
    container_name: io-postgres
    restart: unless-stopped
    # Values come from .env, which Compose loads automatically. The defaults keep
    # `docker compose up` working before anyone has created one.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-io}
      POSTGRES_USER: ${POSTGRES_USER:-io}
      # Local development only. Production credentials come from the platform's
      # environment variables and are never committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-io}
    ports:
      - "5432:5432"
    volumes:
      - io-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-io} -d ${POSTGRES_DB:-io}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  io-postgres-data:
