spring.config.import=optional:file:.env[.properties]

spring.application.name=io

# --- Datasource -------------------------------------------------------------
# Credentials come from the environment. The defaults match docker-compose.yml
# and are intended for local development only.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/io}
spring.datasource.username=${DATABASE_USERNAME:io}
spring.datasource.password=${DATABASE_PASSWORD:io}

# --- JPA / Hibernate --------------------------------------------------------
# Flyway owns the schema. Hibernate must never create or alter it, only check
# that the mapped entities agree with what Flyway produced.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Authentication ---------------------------------------------------------
# JWT_SECRET has no default on purpose: the application must refuse to start rather
# than fall back to a signing key that is public knowledge. Generate one with
#   openssl rand -base64 48
security.jwt.secret=${JWT_SECRET}
# Also required, and also undefaulted: an issuer baked into the build would be wrong in
# every deployment yet accepted by all of them. Use this API's base URL.
security.jwt.issuer=${JWT_ISSUER}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
# We are our own issuer, so there is no third-party clock to drift from.
security.jwt.clock-skew=${JWT_CLOCK_SKEW:5s}

# --- Invitations ------------------------------------------------------------
# How long an organization invitation stays usable. Seven days is where most invitation
# systems land: long enough to survive a weekend, short enough that a forwarded link or a
# stale inbox stops being useful before it matters.
security.invitation.ttl=${INVITATION_TTL:7d}

# Housekeeping for the refresh_tokens table. 03:00 daily.
security.refresh-token-cleanup.cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

# --- OAuth / OIDC sign-in (Google) ---------------------------------------------
# Entirely optional: with no client id set, no provider is registered, the OAuth filter
# chain is never created, and a developer can clone and run without any of this.
#
# Only credentials are configured. Google's endpoints, scopes and grant type are constants
# and live in ClientRegistrations, where they are covered by tests. No issuer-uri is set,
# deliberately: that would make the application perform OIDC discovery over the network at
# startup, so a Google outage would stop us booting.
security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
security.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Where the browser lands after a Google sign-in. Fixed here, never taken from the
# request - a caller-supplied return address is how OAuth turns into an open redirect.
security.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
security.oauth2.failure-redirect-uri=${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/auth/error}
# Only has to survive one redirect.
security.oauth2.login-code-ttl=${OAUTH2_LOGIN_CODE_TTL:60s}

# --- Billing (Stripe) -------------------------------------------------------
# Entirely optional: with no secret key the application still boots and every non-billing
# feature works, exactly as with Google sign-in. Billing endpoints then answer 503.
#
# Secrets come from the environment and are never committed. The webhook secret is what
# every incoming webhook signature is checked against - without it the endpoint would be
# an unauthenticated write path into billing state, so it is required once a key is set.
billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Plan to Stripe price id. The application speaks in plans; price ids live only here, so a
# price can be replaced in Stripe without touching code. FREE has no price by design.
billing.stripe.prices.MONTHLY=${STRIPE_PRICE_MONTHLY:}
billing.stripe.prices.ANNUAL=${STRIPE_PRICE_ANNUAL:}

# Where Stripe returns the browser. Fixed here and never taken from a request - a
# caller-supplied return address is how a checkout flow turns into an open redirect.
billing.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success}
billing.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/billing/cancelled}
billing.stripe.portal-return-url=${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/billing}

# --- Rate limiting ----------------------------------------------------------
# Applies to /api/auth/**, the only endpoints an unauthenticated caller can reach and the
# ones that run Argon2id. Per instance and in memory; edge protection sits in front.
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.capacity=${RATE_LIMIT_CAPACITY:20}
security.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
security.rate-limit.max-tracked-clients=${RATE_LIMIT_MAX_TRACKED_CLIENTS:100000}
# Set to CF-Connecting-IP behind Cloudflare. Leave empty when nothing trustworthy sits in
# front: an attacker-supplied header would otherwise hand out a fresh bucket per request.
security.rate-limit.client-ip-header=${RATE_LIMIT_CLIENT_IP_HEADER:}

# --- Actuator ---------------------------------------------------------------
# Health only, without details, so the endpoint is safe to expose to a platform
# health check.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
