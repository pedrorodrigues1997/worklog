# Test-only signing key. Never used outside the test source set.
security.jwt.secret=test-signing-key-not-a-secret-000000000000
security.jwt.issuer=https://api.test.invalid
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=30d
security.jwt.clock-skew=5s

security.refresh-token-cleanup.cron=0 0 3 * * *

# Off by default: the suite makes far more auth calls from one address than any real
# client would. RateLimitedAuthenticationIntegrationTest turns it back on.
security.rate-limit.enabled=false
security.rate-limit.capacity=20
security.rate-limit.window=1m
security.rate-limit.max-tracked-clients=1000
security.rate-limit.client-ip-header=
